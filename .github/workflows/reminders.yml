name: meeting-reminders

# Scheduling moved to launchd on the Mac (every 5 min). GitHub's free scheduler
# only fired 3 times in 20 hours against a */15 cron, nowhere near precise enough
# for a T-30 reminder. Kept here for manual dry-run testing only.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print emails instead of sending"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Send due reminders
        env:
          ICS_URL:            ${{ secrets.ICS_URL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INVITEE_TZ:         Europe/London
          DRY_RUN:            ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 remind.py

      - name: Remember what was sent
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "reminders-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "state: reminders sent [skip ci]"
            git push
          fi
