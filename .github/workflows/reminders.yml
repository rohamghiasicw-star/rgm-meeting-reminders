name: meeting-reminders

on:
  schedule:
    # Every 15 min, 06:00-15:59 UTC. Covers the 09:00-15:00 UK booking window
    # in both BST and GMT, with room for the T-75 lead time.
    # 40 runs/day = ~1,200 min/month, inside the 2,000 free private-repo minutes.
    - cron: "*/15 6-15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print emails instead of sending"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Send due reminders
        env:
          ICS_URL:            ${{ secrets.ICS_URL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INVITEE_TZ:         Europe/London
          DRY_RUN:            ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 remind.py

      - name: Remember what was sent
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "reminders-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "state: reminders sent [skip ci]"
            git push
          fi
